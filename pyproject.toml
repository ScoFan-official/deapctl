[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deapctl"
version = "0.1.0"
description = "DingTalk DEAP console automation CLI (browser-driven, draft-scope only)"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "mcp>=1.2",
]

[project.scripts]
deapctl = "deapctl.cli:main"

[tool.setuptools.packages.find]
include = ["deapctl*"]
